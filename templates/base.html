{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Impulsa Local - Alcaldía Ciudad Nueva{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="header-alcaldia">
        <div class="logo-contenedor">
            <div class="logo-circulo">CN</div>
            <div class="texto-alcaldia">
                <h1>Alcaldía</h1>
                <p>Ciudad Nueva</p>
            </div>
        </div>
        <div class="decoracion-ventana">
            <span class="circulo-ventana"></span>
            <span class="circulo-ventana"></span>
            <span class="circulo-ventana"></span>
        </div>
    </header>

    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer-contactanos">
        <span>Contáctanos</span>
        <a href="#" class="icon-red"><i class="fa-brands fa-whatsapp"></i></a>
        <a href="#" class="icon-red"><i class="fa-brands fa-instagram"></i></a>
    </footer>

</body>
</html>
