{% extends 'base.html' %}

{% block content %}
<div class="auth-wrapper">
    
    <div class="tabs-container">
        <a href="{% url 'login' %}" class="tab-link tab-btn-azul">Iniciar sesión</a>
        <a href="{% url 'register' %}" class="tab-link tab-active-white">Registrarse</a>
    </div>

    <div class="auth-card">
        <div class="form-interno">
            <h3 class="titulo-contexto">Sign Up</h3>
            <div class="separador"></div>

            <form method="post">
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="form-group">
                        <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}:</label>
                        <input type="{{ field.field.widget.input_type|default:'text' }}" 
                               name="{{ field.html_name }}" 
                               id="{{ field.id_for_label }}" 
                               class="form-input">
                        {% if field.errors %}
                            <div class="error-alert" style="margin-top: 4px; margin-bottom: 0;">{{ field.errors.0 }}</div>
                        {% endif %}
                    </div>
                {% endfor %}

                <div class="separador"></div>

                <div class="btn-container">
                    <button type="submit" class="btn-continuar">Registrarme</button>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
